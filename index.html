<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galleria</title>
    <style>
        /* Caricamento del font personalizzato */
        @font-face {
            font-family: 'MagicFont';
            src: url('font.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Schermata 1: Input Nome */
        #screen-input {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: #111;
        }
        #spectator-name {
            width: 80%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }

            /* Schermata 2: Nuova Galleria Stile iPhone */
        #screen-gallery {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* Contenitore verticale per scorrere le foto (3 colonne) */
        #gallery-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll; /* Permette lo scorrimento in giù */
            -webkit-overflow-scrolling: touch; /* Rende lo scorrimento fluido su iPhone */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: calc(100vw / 3); /* Crea quadrati perfetti */
            gap: 2px;
            padding-bottom: 40px;
        }

        .gallery-thumb {
            width: 100%;
            height: 100%;
            position: relative;
            background: #111;
        }
        .gallery-thumb img, .gallery-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Griglia invisibile bloccata fissa sullo schermo */
        #invisible-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 10;
            pointer-events: none; /* Fa passare il tocco per lo scorrimento */
        }
        .grid-cell {
            background: transparent;
            pointer-events: auto; /* Riattiva il tocco per registrare il numero */
            /* border: 1px rgba(255,255,255,0.1) solid; */ /* Togli il commento per vedere i quadrati nei test */
        }

        /* Schermata 3: Rivelazione Finale con Canvas */
        #screen-video {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; 
        }
        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
                #btn-save-name {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
        }
        #btn-save-name:active {
            background-color: #555; /* Effetto visivo al tocco */
        }

    </style>
</head>
<body>

    
    <!-- S1: INPUT INIZIALE CON PULSANTE -->
    <div id="screen-input">
        <input type="text" id="spectator-name" placeholder="Inserisci il nome..." autocomplete="off">
        <!-- Nuovo pulsante invisibile/elegante per andare avanti -->
        <button id="btn-save-name">AVANTI</button>
    </div>

       <!-- S2: GALLERIA IPHONE A GRIGLIA -->
    <div id="screen-gallery">
        <div id="gallery-scroll-container">
            
            <!-- Il video recente (Primo quadrato in alto a sinistra) -->
            <div class="gallery-thumb" id="video-click-target">
                <video src="video.mp4" muted playsinline></video>
            </div>
            
            <!-- Le tue foto reali (3 per riga) -->
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
        </div>

        <!-- Griglia invisibile fissa 1-9 (Senza lo 0 per ora) -->
        <div id="invisible-grid">
            <div class="grid-cell" data-value="1"></div>
            <div class="grid-cell" data-value="2"></div>
            <div class="grid-cell" data-value="3"></div>
            <div class="grid-cell" data-value="4"></div>
            <div class="grid-cell" data-value="5"></div>
            <div class="grid-cell" data-value="6"></div>
            <div class="grid-cell" data-value="7"></div>
            <div class="grid-cell" data-value="8"></div>
            <div class="grid-cell" data-value="9"></div>
        </div>
    </div>


    <!-- S3: RIVELAZIONE CANVAS -->
    <div id="screen-video">
        <video id="main-video" src="video.mp4" playsinline></video>
        <canvas id="video-canvas"></canvas>
    </div>
    <script>
        // --- CONFIGURAZIONE DEL TRUCCO ---
        const CONFIG = {
            // Tempo in secondi e millisecondi in cui appare la scritta sulla lavagna
            // Esempio: 4.35 significa 4 secondi e 350 millisecondi
            TEMPO_APPARIZIONE: 4.35, 
            
            // Posizione del testo sulla lavagna (in pixel basati sul file video originale)
            TEXT_X: 540,  // Coordinata X del centro della lavagna
            TEXT_Y: 960,  // Coordinata Y della lavagna
            FONT_SIZE: 50, // Dimensione del font
            FONT_COLOR: '#111111', // Colore stile pennarello nero
            MAX_WIDTH: 400 // Larghezza massima della scritta prima di andare a capo
        };

        // --- VARIABILI DI STATO ---
        let infoSpettatore = { nome: '', numero: '' };
        let tocchiNumerici = [];
        let fotoCorrente = 0;
        const totaleElementiGalleria = 3; // Video + Foto 1 + Foto 2

        // Elementi DOM
        const inputNome = document.getElementById('spectator-name');
        const screenInput = document.getElementById('screen-input');
        const screenGallery = document.getElementById('screen-gallery');
        const screenVideo = document.getElementById('screen-video');
        const slider = document.getElementById('gallery-slider');
        const video = document.getElementById('main-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');

        // --- GESTIONE SCHERMATA 1: INPUT NOME ---
        inputNome.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                infoSpettatore.nome = this.value.trim().toUpperCase();
                screenInput.style.display = 'none';
                screenGallery.style.display = 'block';
                // Forza il caricamento preventivo del font sul canvas per evitare ritardi
                ctx.font = "10px MagicFont";
                ctx.fillText("preload", 0, 0);
            }
        });

        // --- GESTIONE SCHERMATA 2: NUOVA LOGICA GRIGLIA E SCORRIMENTO ---
        document.querySelectorAll('.grid-cell').forEach(cell => {
            cell.addEventListener('click', function(e) {
                // Non blocchiamo gli eventi per permettere il movimento dello sfondo
                let valoreSelezionato = parseInt(this.getAttribute('data-value'));

                // Registra solo i primi due tocchi eseguiti sullo schermo
                if (tocchiNumerici.length < 2) {
                    tocchiNumerici.push(valoreSelezionato);

                    if (tocchiNumerici.length === 2) {
                        // Unisce i due tocchi per generare la stringa del numero (es. 4 e 7 = "47")
                        infoSpettatore.numero = `${tocchiNumerici[0]}${tocchiNumerici[1]}`;
                        console.log("Numero segreto memorizzato:", infoSpettatore.numero);
                    }
                }
            });
        });

        // APERTURA E SBLOCCO DEL VIDEO (Ottimizzato per iOS e Safari)
        document.getElementById('video-click-target').addEventListener('click', function(e) {
            // Impedisce che il tocco sul video attivi anche la griglia invisibile sottostante
            e.stopPropagation(); 
            
            screenGallery.style.display = 'none';
            screenVideo.style.display = 'block';
            
            // Sblocca preventivamente l'elemento video nativo caricando la sorgente
            video.pause();
            video.src = "video.mp4";
            video.load();

            // Configura le dimensioni del Canvas basandoti sul file video reale
            video.addEventListener('loadedmetadata', function() {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }, { once: true });

            // Esegue l'avvio del video forzando le politiche restrittive dei browser mobili
            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    renderLoop();
                }).catch(error => {
                    console.log("Riproduzione inizialmente bloccata:", error);
                    // Tentativo di riproduzione forzata secondario
                    video.play();
                    renderLoop();
                });
            }
        });


        // --- GESTIONE SCHERMATA 3: CANVAS E SOVRASCRITTURA DEL TESTO ---
        function renderLoop() {
            if (!video.paused && !video.ended) {
                // 1. Disegna il frame corrente del video sul canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Se il timer del video supera il secondo impostato, disegna la scritta
                if (video.currentTime >= CONFIG.TEMPO_APPARIZIONE) {
                    ctx.save();
                    
                    // Impostazioni del font
                    ctx.font = `${CONFIG.FONT_SIZE}px 'MagicFont'`;
                    ctx.fillStyle = CONFIG.FONT_COLOR;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Il testo dinamico che apparirà sulla lavagna
                    let testoFinale = `${infoSpettatore.nome} PENSERAI AL ${infoSpettatore.numero}`;
                    
                    // Funzione per scrivere il testo andando a capo se la lavagna è stretta
                    disegnaTestoMultilinea(ctx, testoFinale, CONFIG.TEXT_X, CONFIG.TEXT_Y, CONFIG.MAX_WIDTH, CONFIG.FONT_SIZE * 1.2);
                    
                    ctx.restore();
                }

                // Continua a ridisegnare il canvas a ogni frame disponibile
                requestAnimationFrame(renderLoop);
            }
        }

        // Funzione di supporto per formattare il testo su più righe senza tagliare le parole
        function disegnaTestoMultilinea(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // Calcola l'altezza iniziale per centrare perfettamente il blocco di testo in verticale
            let startY = y - ((lines.length - 1) * lineHeight) / 2;

            for (let k = 0; k < lines.length; k++) {
                context.fillText(lines[k].trim(), x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
