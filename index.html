<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Galleria</title>
    <style>
        /* Caricamento del font personalizzato */
        @font-face {
            font-family: 'MagicFont';
            src: url('Lacquer-Regular.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Schermata 1: Input Nome */
        #screen-input {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: #111;
        }
        #spectator-name {
            width: 80%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }

            /* Schermata 2: Nuova Galleria Stile iPhone */
        #screen-gallery {
             opacity: 0;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* Contenitore verticale per scorrere le foto (3 colonne) */
        #gallery-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll; /* Permette lo scorrimento in giù */
            -webkit-overflow-scrolling: touch; /* Rende lo scorrimento fluido su iPhone */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: calc(100vw / 3); /* Crea quadrati perfetti */
            gap: 1px;
           box-sizing: border-box;
            padding-bottom: 50px;
        }
        /* MODIFICA CHIRURGICA: Intestazione fissa trasparente senza alcuna sfumatura */
        .ios-gallery-header {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            padding: 0px 20px 0px 20px; /* Ridotto lo spazio sul fondo per stringere */
            box-sizing: border-box;
            
            /* Sfondo completamente invisibile (nessuna sfocatura o colore) */
            background: transparent; 
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            
            z-index: 99; 
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none; 
        }

        /* Stile dei testi interni bianchi e attaccati */
        .ios-gallery-header h1 {
            color: #ffffff; /* Scritta bianca pulita */
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.1; /* Stringe lo spazio verticale del titolo */
        }
        .ios-gallery-header span {
            color: #ffffff; /* Modificata in bianco pieno */
            font-size: 13px;
            font-weight: 400;
            margin-top: -2px; /* Avvicina il sottotitolo alla scritta sopra */
            line-height: 1.1;
        }



        .gallery-thumb {
            width: 100%;
            height: 100%;
            position: relative;
            background: #111;
        }
        .gallery-thumb img, .gallery-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            /* Griglia invisibile bloccata fissa sullo schermo */
        #invisible-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 10;
            pointer-events: none; /* Lascia libero lo scorrimento verticale dello sfondo */
        }
        .grid-cell {
            background: transparent;
            pointer-events: none; /* Rilascia totalmente lo schermo per permettere lo scorrimento */
        }


              /* Schermata 3: Contenitore fisso che entra in dissolvenza graduale */
        #screen-video {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0); 
            z-index: 200;
            /* Gestisce solo la dissolvenza fluida dello sfondo nero */
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #screen-video.running {
            background-color: rgba(0, 0, 0, 1);
        }

        #main-video {
            display: none; 
        }

        /* Il Canvas si espande usando i pixel reali e legge i tuoi parametri qui sotto */
        #video-canvas {
            position: absolute;
            object-fit: cover; 
            
            /* PARAMETRI DA REGOLARE MANO MANO (Ora salvati al sicuro): */
            top: 30px;      /* Decidi quanti pixel di spazio nero lasciare in ALTO */
            height: 86%;    /* Decidi l'ALTEZZA verticale del video (puoi usare % o px) */
            
            /* Curva Apple originale rallentata a 0.8s, super fluida sulla GPU dell'iPhone */
            transition: top 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        left 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        width 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }




                #btn-save-name {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
        }
        #btn-save-name:active {
            background-color: #555; /* Effetto visivo al tocco */
        }

    </style>
</head>
<body>

    
    <!-- S1: INPUT INIZIALE CON PULSANTE -->
    <div id="screen-input">
        <input type="text" id="spectator-name" placeholder="Inserisci il nome..." autocomplete="off">
        <!-- Nuovo pulsante invisibile/elegante per andare avanti -->
        <button id="btn-save-name">AVANTI</button>
    </div>

             <!-- S2: GALLERIA IPHONE A GRIGLIA -->
    <div id="screen-gallery">
        
        <!-- MODIFICA CHIRURGICA: Intestazione Libreria fissa in alto -->
        <div class="ios-gallery-header">
            <h1 class="ios-gallery-title">Libreria</h1>
            <span class="ios-gallery-subtitle">1541 elementi</span>
        </div>

        <div id="gallery-scroll-container">

            

            
        <!-- Molte più foto per costringere lo schermo a scorrere in basso -->
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
                                 <div class="gallery-thumb" id="video-click-target">
                <img src="foto1.PNG" style="width:100%; height:100%; object-fit:cover;">
            </div>


        </div>
        </div>

        <!-- Griglia invisibile fissa 1-9 (Senza lo 0 per ora) -->
        <div id="invisible-grid">
            <div class="grid-cell" data-value="1"></div>
            <div class="grid-cell" data-value="2"></div>
            <div class="grid-cell" data-value="3"></div>
            <div class="grid-cell" data-value="4"></div>
            <div class="grid-cell" data-value="5"></div>
            <div class="grid-cell" data-value="6"></div>
            <div class="grid-cell" data-value="7"></div>
            <div class="grid-cell" data-value="8"></div>
            <div class="grid-cell" data-value="9"></div>
        </div>
    </div>


    <!-- S3: RIVELAZIONE CANVAS -->
    <div id="screen-video">
        <video id="main-video" src="video.mp4" playsinline></video>
        <canvas id="video-canvas"></canvas>
    </div>
    <script>
        // --- CONFIGURAZIONE DEL TRUCCO ---
        const CONFIG = {
            // Tempo in secondi e millisecondi in cui appare la scritta sulla lavagna
            // Esempio: 4.35 significa 4 secondi e 350 millisecondi
            TEMPO_APPARIZIONE: 5.66, 
            
            // Posizione del testo sulla lavagna (in pixel basati sul file video originale)
            TEXT_X: 440,  // Coordinata X del centro della lavagna
            TEXT_Y: 700,  // Coordinata Y della lavagna
            FONT_SIZE: 50, // Dimensione del font
            FONT_COLOR: '#111111', // Colore stile pennarello nero
            MAX_WIDTH: 400 // Larghezza massima della scritta prima di andare a capo
        };

        // --- VARIABILI DI STATO ---
        let infoSpettatore = { nome: '', numero: '' };
        let tocchiNumerici = [];
        let fotoCorrente = 0;
        const totaleElementiGalleria = 3; // Video + Foto 1 + Foto 2

        // Elementi DOM
        const inputNome = document.getElementById('spectator-name');
        const screenInput = document.getElementById('screen-input');
        const screenGallery = document.getElementById('screen-gallery');
        const screenVideo = document.getElementById('screen-video');
        const slider = document.getElementById('gallery-slider');
        const video = document.getElementById('main-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');

             // --- GESTIONE SCHERMATA 1: INPUT NOME ---
        const btnSalva = document.getElementById('btn-save-name');

        function procediAllaGalleria() {
            let nomeInserito = inputNome.value.trim();
            if (nomeInserito !== '') {
               infoSpettatore.nome = nomeInserito.toLowerCase();
                screenInput.style.display = 'none';
                screenGallery.style.opacity = '1';
                screenGallery.style.pointerEvents = 'auto';
                containerGalleria.scrollTop = containerGalleria.scrollHeight;
                ctx.font = "10px MagicFont";
                ctx.fillText("preload", 0, 0);
            }
        }

        // Attiva il pulsante AVANTI al tocco
        btnSalva.addEventListener('click', procediAllaGalleria);

        // Mantiene l'invio da tastiera
        inputNome.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                procediAllaGalleria();
            }
        });


                // --- GESTIONE SCHERMATA 2: CATTURA ISTANTANEA AL TOCCO INIZIALE ---
        const containerGalleria = document.getElementById('gallery-scroll-container');

        containerGalleria.addEventListener('touchstart', function(e) {
            // Prendiamo il punto esatto dello schermo dove il dito si è appena appoggiato
            let touch = e.touches[0];
            let targetX = touch.clientX;
            let targetY = touch.clientY;

            // Dividiamo lo schermo del telefono in una griglia 3x3 pulita
            let widthSezione = window.innerWidth / 3;
            let heightSezione = window.innerHeight / 3;

            let colonna = Math.floor(targetX / widthSezione); // 0, 1 o 2
            let riga = Math.floor(targetY / heightSezione);    // 0, 1 o 2

            // Converte le coordinate in un numero da 1 a 9
            let valoreSelezionato = (riga * 3) + colonna + 1;

            // Sicurezza per evitare tocchi millimetrici fuori dai bordi dello schermo
            if (valoreSelezionato < 1 || valoreSelezionato > 9) return;

                              // Il video ora è l'ultimo elemento in basso a destra (posizione 9 della griglia visibile sul fondo)
            if (tocchiNumerici.length >= 2 && valoreSelezionato === 9) {
                // Passiamo le coordinate esatte X e Y del dito alla funzione di avvio
                avviaIlVideoMagico(targetX, targetY);
                return;
            }



            // Registra le cifre (solo per i primi due appoggi del dito)
            if (tocchiNumerici.length < 2) {
                tocchiNumerici.push(valoreSelezionato);

                if (tocchiNumerici.length === 2) {
                    // Unisce la prima e la seconda cifra in una stringa di testo
                    infoSpettatore.numero = "" + tocchiNumerici[0] + tocchiNumerici[1];
                    console.log("Numero segreto memorizzato al volo: " + infoSpettatore.numero);
                }
            }
        }, { passive: true }); // 'passive: true' garantisce che lo scorrimento di iOS rimanga fluidissimo

        function avviaIlVideoMagico(touchX, touchY) {
            // 1. Catturiamo la posizione millimetrica reale della cella sullo schermo
            const targetThumb = document.getElementById('video-click-target');
            const rect = targetThumb.getBoundingClientRect();
            
            // Memorizziamo l'altezza e il top che hai impostato nel CSS per il video finale
            const stileCssOriginale = window.getComputedStyle(canvas);
            const altezzaFinaleCss = stileCssOriginale.height;
            const topFinaleCss = stileCssOriginale.top;

            // 2. Prepariamo il video in background
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.src = "video.mp4";
            video.load();

            video.addEventListener('loadedmetadata', function() {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Disegna subito il fotogramma iniziale statico sul canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Mostriamo IMMEDIATAMENTE la schermata (inizialmente trasparente)
                screenGallery.style.display = 'none';
                screenVideo.style.display = 'block';
                
                // INCOLLIAMO IL CANVAS sopra la miniatura toccata (anche se è tutta a destra)
                canvas.style.top = rect.top + 'px';
                canvas.style.left = rect.left + 'px';
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                
                // TRUCCO BLINDATO: Forziamo l'iPhone a calcolare la posizione iniziale a destra
                // Senza questa riga, Safari ignora la posizione e fa partire lo zoom da sinistra
                canvas.offsetHeight; 

                // 3. Ora che l'iPhone sa che siamo a destra, facciamo scattare l'espansione verso sinistra
                requestAnimationFrame(() => {
                    screenVideo.classList.add('running'); // Lo sfondo diventa nero lentamente
                    
                    // Il Canvas si espande fluidamente verso la sua posizione finale centrata
                    canvas.style.top = topFinaleCss;      
                    canvas.style.left = '0px';
                    canvas.style.width = '100%';    
                    canvas.style.height = altezzaFinaleCss;    
                });
            }, { once: true });

            // 4. Avvio del ciclo continuo del video
            video.addEventListener('play', function() {
                renderLoop();
            });

            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    renderLoop();
                }).catch(error => {
                    video.play();
                    renderLoop();
                });
            }
        }


        // --- GESTIONE SCHERMATA 3: CANVAS E SOVRASCRITTURA DEL TESTO ---
        function renderLoop() {
            if (!video.paused && !video.ended) {
                // 1. Disegna il frame corrente del video sul canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Se il timer del video supera il secondo impostato, disegna la scritta
                if (video.currentTime >= CONFIG.TEMPO_APPARIZIONE) {
                    ctx.save();
                    
                    // Impostazioni del font
                    ctx.font = `${CONFIG.FONT_SIZE}px 'MagicFont'`;
                    ctx.fillStyle = CONFIG.FONT_COLOR;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Il testo dinamico che apparirà sulla lavagna
                    let testoFinale = `${infoSpettatore.nome} penserai al ${infoSpettatore.numero}`;

                    
                    // Funzione per scrivere il testo andando a capo se la lavagna è stretta
                    disegnaTestoMultilinea(ctx, testoFinale, CONFIG.TEXT_X, CONFIG.TEXT_Y, CONFIG.MAX_WIDTH, CONFIG.FONT_SIZE * 1.2);
                    
                    ctx.restore();
                }

                // Continua a ridisegnare il canvas a ogni frame disponibile
                requestAnimationFrame(renderLoop);
            }
        }

        // Funzione di supporto per formattare il testo su più righe senza tagliare le parole
        function disegnaTestoMultilinea(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // Calcola l'altezza iniziale per centrare perfettamente il blocco di testo in verticale
            let startY = y - ((lines.length - 1) * lineHeight) / 2;

            for (let k = 0; k < lines.length; k++) {
                context.fillText(lines[k].trim(), x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
