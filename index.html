<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galleria</title>
    <style>
        /* Caricamento del font personalizzato */
        @font-face {
            font-family: 'MagicFont';
            src: url('Lacquer-Regular.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Schermata 1: Input Nome */
        #screen-input {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: #111;
        }
        #spectator-name {
            width: 80%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }

            /* Schermata 2: Nuova Galleria Stile iPhone */
        #screen-gallery {
             opacity: 0;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* Contenitore verticale per scorrere le foto (3 colonne) */
        #gallery-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll; /* Permette lo scorrimento in giù */
            -webkit-overflow-scrolling: touch; /* Rende lo scorrimento fluido su iPhone */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: calc(100vw / 3); /* Crea quadrati perfetti */
            gap: 1px;
           box-sizing: border-box;
            padding-bottom: 80px;
        }

        .gallery-thumb {
            width: 100%;
            height: 100%;
            position: relative;
            background: #111;
        }
        .gallery-thumb img, .gallery-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            /* Griglia invisibile bloccata fissa sullo schermo */
        #invisible-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 10;
            pointer-events: none; /* Lascia libero lo scorrimento verticale dello sfondo */
        }
        .grid-cell {
            background: transparent;
            pointer-events: none; /* Rilascia totalmente lo schermo per permettere lo scorrimento */
        }


        /* Schermata 3: Rivelazione Finale con Canvas */
        #screen-video {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; 
        }
        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
                #btn-save-name {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
        }
        #btn-save-name:active {
            background-color: #555; /* Effetto visivo al tocco */
        }
                /* Contenitore principale interfaccia video */
        #video-controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 50px 20px 40px 20px;
            pointer-events: none; /* Evita di bloccare i tocchi sul canvas */
            transition: opacity 0.4s ease; /* Animazione di sparizione */
            opacity: 1;
        }

        /* Stile base delle Bubble Apple */
        .ios-bubble {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* Barra Superiore */
        .ios-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .btn-back, .btn-more {
            width: 38px;
            height: 38px;
            font-size: 16px;
        }
        .ios-center-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
        }
        .ios-date { font-size: 15px; font-weight: 600; }
        .ios-time { font-size: 11px; color: #aaa; margin-top: 2px; }

        /* Controlli specifici del Video (Muto, Play, Durata) */
        .ios-video-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: auto;
            margin-bottom: 15px;
            width: 100%;
        }
        .btn-play, .btn-mute {
            width: 34px;
            height: 34px;
            font-size: 14px;
        }
        .ios-video-timeline {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: -apple-system, sans-serif;
        }

        /* Carosello miniature ultime foto */
        .ios-photo-strip {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
            margin-bottom: 15px;
        }
        .strip-thumb {
            width: 45px;
            height: 30px;
            background: rgba(60, 60, 60, 0.5);
            border-radius: 4px;
        }
        .strip-thumb.active {
            border: 1.5px solid #fff;
        }

        /* Barra Inferiore */
        .ios-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .btn-share, .btn-delete {
            width: 38px;
            height: 38px;
            font-size: 16px;
        }
        .ios-center-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-heart, .btn-info {
            width: 38px;
            height: 38px;
            font-size: 16px;
        }
        .btn-edit {
            padding: 0 15px;
            border-radius: 20px;
            height: 38px;
            font-size: 13px;
            font-weight: 500;
        }


    </style>
</head>
<body>

    
    <!-- S1: INPUT INIZIALE CON PULSANTE -->
    <div id="screen-input">
        <input type="text" id="spectator-name" placeholder="Inserisci il nome..." autocomplete="off">
        <!-- Nuovo pulsante invisibile/elegante per andare avanti -->
        <button id="btn-save-name">AVANTI</button>
    </div>

       <!-- S2: GALLERIA IPHONE A GRIGLIA -->

        <div id="gallery-scroll-container">
            

            
        <!-- Molte più foto per costringere lo schermo a scorrere in basso -->

            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto1.PNG"></div>
            <div class="gallery-thumb"><img src="foto2.PNG"></div>
                                 <div class="gallery-thumb" id="video-click-target">
                <img src="foto1.PNG" style="width:100%; height:100%; object-fit:cover;">
            </div>


        </div>
        </div>

        <!-- Griglia invisibile fissa 1-9 (Senza lo 0 per ora) -->
        <div id="invisible-grid">
            <div class="grid-cell" data-value="1"></div>
            <div class="grid-cell" data-value="2"></div>

        </div>

      <!-- S3: RIVELAZIONE CANVAS -->
    <div id="screen-video">
        <video id="main-video" src="video.mp4" playsinline></video>
        <canvas id="video-canvas"></canvas>

        <!-- INTERFACCIA VIDEO STILE IPHONE (BUBBLES) -->
        <div id="video-controls-overlay">
            <!-- Barra Superiore -->
            <div class="ios-top-bar">
                <div class="ios-bubble btn-back">〈</div>
                <div class="ios-center-meta">
                    <span class="ios-date">Ieri</span>
                    <span class="ios-time">18:45</span>
                </div>
                <div class="ios-bubble btn-more">•••</div>
            </div>

            <!-- Controlli Video Centrali/Bassi -->
            <div class="ios-video-controls">
                <div class="ios-bubble btn-play">⏸</div>
                <div class="ios-video-timeline">0:00</div>
                <div class="ios-bubble btn-mute">🔊</div>
            </div>

            <!-- Carosello ultime foto (Anteprima rapida) -->
            <div class="ios-photo-strip">
                <div class="strip-thumb active"></div>
                <div class="strip-thumb"></div>
                <div class="strip-thumb"></div>
                <div class="strip-thumb"></div>
                <div class="strip-thumb"></div>
            </div>

            <!-- Barra Inferiore delle Azioni -->
            <div class="ios-bottom-bar">
                <div class="ios-bubble btn-share">⎋</div>
                <div class="ios-center-actions">
                    <div class="ios-bubble btn-heart">♡</div>
                    <div class="ios-bubble btn-info">ⓘ</div>
                    <div class="ios-bubble btn-edit">Modifica</div>
                </div>
                <div class="ios-bubble btn-delete">🗑</div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE DEL TRUCCO ---
        const CONFIG = {
            // Tempo in secondi e millisecondi in cui appare la scritta sulla lavagna
            // Esempio: 4.35 significa 4 secondi e 350 millisecondi
            TEMPO_APPARIZIONE: 5.66, 
            
            // Posizione del testo sulla lavagna (in pixel basati sul file video originale)
            TEXT_X: 440,  // Coordinata X del centro della lavagna
            TEXT_Y: 700,  // Coordinata Y della lavagna
            FONT_SIZE: 50, // Dimensione del font
            FONT_COLOR: '#111111', // Colore stile pennarello nero
            MAX_WIDTH: 400 // Larghezza massima della scritta prima di andare a capo
        };

        // --- VARIABILI DI STATO ---
        let infoSpettatore = { nome: '', numero: '' };
        let tocchiNumerici = [];
        let fotoCorrente = 0;
        const totaleElementiGalleria = 3; // Video + Foto 1 + Foto 2

        // Elementi DOM
        const inputNome = document.getElementById('spectator-name');
        const screenInput = document.getElementById('screen-input');
        const screenGallery = document.getElementById('screen-gallery');
        const screenVideo = document.getElementById('screen-video');
        const slider = document.getElementById('gallery-slider');
        const video = document.getElementById('main-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');

             // --- GESTIONE SCHERMATA 1: INPUT NOME ---
        const btnSalva = document.getElementById('btn-save-name');

        function procediAllaGalleria() {
            let nomeInserito = inputNome.value.trim();
            if (nomeInserito !== '') {
               infoSpettatore.nome = nomeInserito.toLowerCase();
                screenInput.style.display = 'none';
                screenGallery.style.opacity = '1';
                screenGallery.style.pointerEvents = 'auto';
                containerGalleria.scrollTop = containerGalleria.scrollHeight;
                ctx.font = "10px MagicFont";
                ctx.fillText("preload", 0, 0);
            }
        }

        // Attiva il pulsante AVANTI al tocco
        btnSalva.addEventListener('click', procediAllaGalleria);

        // Mantiene l'invio da tastiera
        inputNome.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                procediAllaGalleria();
            }
        });


                // --- GESTIONE SCHERMATA 2: CATTURA ISTANTANEA AL TOCCO INIZIALE ---
        const containerGalleria = document.getElementById('gallery-scroll-container');

        containerGalleria.addEventListener('touchstart', function(e) {
            // Prendiamo il punto esatto dello schermo dove il dito si è appena appoggiato
            let touch = e.touches[0];
            let targetX = touch.clientX;
            let targetY = touch.clientY;

            // Dividiamo lo schermo del telefono in una griglia 3x3 pulita
            let widthSezione = window.innerWidth / 3;
            let heightSezione = window.innerHeight / 3;

            let colonna = Math.floor(targetX / widthSezione); // 0, 1 o 2
            let riga = Math.floor(targetY / heightSezione);    // 0, 1 o 2

            // Converte le coordinate in un numero da 1 a 9
            let valoreSelezionato = (riga * 3) + colonna + 1;

            // Sicurezza per evitare tocchi millimetrici fuori dai bordi dello schermo
            if (valoreSelezionato < 1 || valoreSelezionato > 9) return;

                      // Il video ora è l'ultimo elemento in basso a destra (posizione 9 della griglia visibile sul fondo)
            if (tocchiNumerici.length >= 2 && valoreSelezionato === 9) {
                avviaIlVideoMagico();
                return;
            }


            // Registra le cifre (solo per i primi due appoggi del dito)
            if (tocchiNumerici.length < 2) {
                tocchiNumerici.push(valoreSelezionato);

                if (tocchiNumerici.length === 2) {
                    // Unisce la prima e la seconda cifra in una stringa di testo
                    infoSpettatore.numero = "" + tocchiNumerici[0] + tocchiNumerici[1];
                    console.log("Numero segreto memorizzato al volo: " + infoSpettatore.numero);
                }
            }
        }, { passive: true }); // 'passive: true' garantisce che lo scorrimento di iOS rimanga fluidissimo


        function avviaIlVideoMagico() {
            screenGallery.style.display = 'none';
            screenVideo.style.display = 'block';
            
            // Forziamo i parametri indispensabili per Apple Safari / iPhone
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.src = "video.mp4";
            video.load();

            video.addEventListener('loadedmetadata', function() {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }, { once: true });

                      let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    renderLoop();
                    
                    // MODIFICA CHIRURGICA: Fa sparire le bolle dopo 2.5 secondi (2500 millisecondi)
                    setTimeout(() => {
                        const overlay = document.getElementById('video-controls-overlay');
                        if (overlay) overlay.style.opacity = '0';
                    }, 2500);

                }).catch(error => {
                    video.play();
                    renderLoop();
                    
                    setTimeout(() => {
                        const overlay = document.getElementById('video-controls-overlay');
                        if (overlay) overlay.style.opacity = '0';
                    }, 2500);
                });
            }

        }


        // --- GESTIONE SCHERMATA 3: CANVAS E SOVRASCRITTURA DEL TESTO ---
        function renderLoop() {
            if (!video.paused && !video.ended) {
                // 1. Disegna il frame corrente del video sul canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Se il timer del video supera il secondo impostato, disegna la scritta
                if (video.currentTime >= CONFIG.TEMPO_APPARIZIONE) {
                    ctx.save();
                    
                    // Impostazioni del font
                    ctx.font = `${CONFIG.FONT_SIZE}px 'MagicFont'`;
                    ctx.fillStyle = CONFIG.FONT_COLOR;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Il testo dinamico che apparirà sulla lavagna
                    let testoFinale = `${infoSpettatore.nome} penserai al ${infoSpettatore.numero}`;

                    
                    // Funzione per scrivere il testo andando a capo se la lavagna è stretta
                    disegnaTestoMultilinea(ctx, testoFinale, CONFIG.TEXT_X, CONFIG.TEXT_Y, CONFIG.MAX_WIDTH, CONFIG.FONT_SIZE * 1.2);
                    
                    ctx.restore();
                }

                // Continua a ridisegnare il canvas a ogni frame disponibile
                requestAnimationFrame(renderLoop);
            }
        }

        // Funzione di supporto per formattare il testo su più righe senza tagliare le parole
        function disegnaTestoMultilinea(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // Calcola l'altezza iniziale per centrare perfettamente il blocco di testo in verticale
            let startY = y - ((lines.length - 1) * lineHeight) / 2;

            for (let k = 0; k < lines.length; k++) {
                context.fillText(lines[k].trim(), x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
